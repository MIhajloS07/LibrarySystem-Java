<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Library System - Java MVC" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#16213a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1000" height="280" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#grid)"/>

    <!-- soft moving glow -->
    <circle cx="820" cy="60" r="160" fill="#38bdf8" opacity="0.07">
      <animate attributeName="cx" values="800;860;800" dur="9s" repeatCount="indefinite"/>
    </circle>

    <!-- book spines -->
    <g transform="translate(640 0)">
      <g>
        <rect x="0"   y="110" width="34" height="140" rx="3" fill="#38bdf8" opacity="0.9"/>
        <rect x="6"   y="130" width="22" height="3" fill="#0b1220" opacity="0.45"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="5s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="42"  y="80"  width="30" height="170" rx="3" fill="#818cf8" opacity="0.9"/>
        <rect x="48"  y="104" width="18" height="3" fill="#0b1220" opacity="0.45"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="6s" begin="0.6s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="80"  y="125" width="38" height="125" rx="3" fill="#34d399" opacity="0.9"/>
        <rect x="87"  y="145" width="24" height="3" fill="#0b1220" opacity="0.45"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="4.5s" begin="1.1s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="126" y="95"  width="32" height="155" rx="3" fill="#f472b6" opacity="0.85"/>
        <rect x="132" y="118" width="20" height="3" fill="#0b1220" opacity="0.45"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="5.5s" begin="0.3s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="166" y="135" width="36" height="115" rx="3" fill="#fbbf24" opacity="0.85"/>
        <rect x="173" y="155" width="22" height="3" fill="#0b1220" opacity="0.45"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="4.8s" begin="0.9s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="210" y="70"  width="30" height="180" rx="3" fill="#38bdf8" opacity="0.6"/>
        <rect x="216" y="94"  width="18" height="3" fill="#0b1220" opacity="0.45"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -11;0 0" dur="6.4s" begin="1.4s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- shelf -->
    <rect x="620" y="250" width="360" height="6" rx="3" fill="#ffffff" opacity="0.14"/>

    <!-- title -->
    <text x="60" y="122" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="700" fill="#f8fafc" opacity="0" letter-spacing="-1">
      Library System
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.2s" fill="freeze"/>
    </text>

    <!-- accent line draws itself -->
    <rect x="62" y="142" height="4" rx="2" fill="url(#accent)" width="0">
      <animate attributeName="width" from="0" to="300" dur="1.2s" begin="0.8s" fill="freeze"/>
    </rect>

    <text x="60" y="190" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#94a3b8" opacity="0">
      Console application for books, users and lending
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="1.2s" fill="freeze"/>
    </text>

    <text x="60" y="228" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="16" fill="#38bdf8" opacity="0" letter-spacing="1">
      Java 21  /  MVC  /  JDBC  /  SQLite  /  JUnit 5  /  Docker
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="1.7s" fill="freeze"/>
    </text>

    <!-- bottom accent bar -->
    <rect x="0" y="276" width="1000" height="4" fill="url(#accent)" opacity="0.9"/>
  </g>
</svg>
