<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-label="MVC architecture with request flow" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <style>
      .bg{fill:#0b1220}
      .box{fill:#111b30;stroke-width:1.5}
      .h{font:700 16px 'Segoe UI',Arial,sans-serif;fill:#f1f5f9;text-anchor:middle}
      .s{font:12px 'SFMono-Regular',Consolas,monospace;fill:#94a3b8;text-anchor:middle}
      .tag{font:700 11px 'Segoe UI',Arial,sans-serif;letter-spacing:2px;text-anchor:middle}
      .line{stroke:#2b3a58;stroke-width:2;fill:none;stroke-dasharray:5 5}
    </style>
  </defs>
  <rect class="bg" width="1000" height="380" rx="14"/>

  <text class="tag" x="500" y="38" fill="#64748b">REQUEST FLOW</text>

  <!-- connectors -->
  <path class="line" d="M175 160H225M375 160H425M575 160H625M775 160H825"/>
  <path class="line" d="M500 210V290"/>

  <!-- nodes -->
  <g>
    <rect class="box" x="25" y="110" width="150" height="100" rx="12" stroke="#64748b"/>
    <text class="h" x="100" y="152">User</text><text class="s" x="100" y="176">console</text>
  </g>
  <g>
    <rect class="box" x="225" y="110" width="150" height="100" rx="12" stroke="#38bdf8">
      <animate attributeName="stroke-opacity" values=".35;1;.35" dur="6s" begin="0s" repeatCount="indefinite"/></rect>
    <text class="tag" x="300" y="98" fill="#38bdf8">VIEW</text>
    <text class="h" x="300" y="152">MainUI</text><text class="s" x="300" y="176">MainView</text>
  </g>
  <g>
    <rect class="box" x="425" y="110" width="150" height="100" rx="12" stroke="#818cf8">
      <animate attributeName="stroke-opacity" values=".35;1;.35" dur="6s" begin="1.5s" repeatCount="indefinite"/></rect>
    <text class="tag" x="500" y="98" fill="#818cf8">CONTROLLER</text>
    <text class="h" x="500" y="146">Library</text><text class="h" x="500" y="164">Controller</text>
    <text class="s" x="500" y="186">UserController</text>
  </g>
  <g>
    <rect class="box" x="625" y="110" width="150" height="100" rx="12" stroke="#34d399">
      <animate attributeName="stroke-opacity" values=".35;1;.35" dur="6s" begin="3s" repeatCount="indefinite"/></rect>
    <text class="tag" x="700" y="98" fill="#34d399">PERSISTENCE</text>
    <text class="h" x="700" y="146">BookDb</text><text class="h" x="700" y="164">Controller</text>
    <text class="s" x="700" y="186">DbConnection</text>
  </g>
  <g>
    <rect class="box" x="825" y="110" width="150" height="100" rx="12" stroke="#64748b"/>
    <path d="M900 135c-18 0-28 5-28 10v34c0 5 10 10 28 10s28-5 28-10v-34c0-5-10-10-28-10z" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <ellipse cx="900" cy="145" rx="28" ry="10" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <text class="s" x="900" y="204">SQLite</text>
  </g>
  <g>
    <rect class="box" x="425" y="290" width="150" height="70" rx="12" stroke="#f472b6">
      <animate attributeName="stroke-opacity" values=".35;1;.35" dur="6s" begin="2s" repeatCount="indefinite"/></rect>
    <text class="tag" x="500" y="278" fill="#f472b6">MODEL</text>
    <text class="h" x="500" y="322">Book · User</text><text class="s" x="500" y="344">Library</text>
  </g>

  <!-- packets: request goes right, response comes back -->
  <circle r="6" fill="#38bdf8"><animateMotion dur="6s" repeatCount="indefinite" path="M100 160H900" keyTimes="0;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.05;.95;1" dur="6s" repeatCount="indefinite"/></circle>
  <circle r="5" fill="#34d399"><animateMotion dur="6s" begin="3s" repeatCount="indefinite" path="M900 175H100" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.05;.95;1" dur="6s" begin="3s" repeatCount="indefinite"/></circle>
  <circle r="4" fill="#f472b6"><animateMotion dur="3s" begin="1.5s" repeatCount="indefinite" path="M500 210V290" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="3s" begin="1.5s" repeatCount="indefinite"/></circle>
</svg>
