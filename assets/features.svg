<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" width="1000" height="210" role="img" aria-label="Features" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <style>
      .card{fill:#0f172a;stroke:#243049;stroke-width:1}
      .t{font:700 17px 'Segoe UI',Arial,sans-serif;fill:#f1f5f9}
      .d{font:13px 'Segoe UI',Arial,sans-serif;fill:#94a3b8}
      .i{fill:none;stroke:url(#ac);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur=".7s" begin="0s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 16" to="0 0" dur=".7s" begin="0s" fill="freeze"/>
    <rect class="card" x=".5" y=".5" width="231" height="209" rx="12"/>
    <g transform="translate(28 30)"><g class="i"><path d="M4 6a3 3 0 0 1 3-3h20v28H7a3 3 0 0 0-3 3z"/><path d="M27 3v28M12 10h10"/></g>
      <animateTransform attributeName="transform" additive="sum" type="translate" values="0 0;0 -3;0 0" dur="4s" repeatCount="indefinite"/></g>
    <text class="t" x="28" y="102">Library</text>
    <text class="d" x="28" y="128">Add, remove and list books</text>
    <text class="d" x="28" y="148">Lend and return</text>
    <text class="d" x="28" y="168">Track borrowed titles</text>
  </g>

  <g transform="translate(256 0)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur=".7s" begin=".15s" fill="freeze"/>
    <rect class="card" x=".5" y=".5" width="231" height="209" rx="12"/>
    <g transform="translate(28 30)"><g class="i"><circle cx="15" cy="15" r="11"/><path d="M23.5 23.5L33 33"/></g>
      <animateTransform attributeName="transform" additive="sum" type="translate" values="0 0;0 -3;0 0" dur="4.4s" repeatCount="indefinite"/></g>
    <text class="t" x="28" y="102">Search and sort</text>
    <text class="d" x="28" y="128">Search by author</text>
    <text class="d" x="28" y="148">Search by year</text>
    <text class="d" x="28" y="168">Sort by title or year</text>
  </g>

  <g transform="translate(512 0)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur=".7s" begin=".3s" fill="freeze"/>
    <rect class="card" x=".5" y=".5" width="231" height="209" rx="12"/>
    <g transform="translate(28 30)"><g class="i"><circle cx="17" cy="11" r="7"/><path d="M3 33c0-8 6-12 14-12s14 4 14 12"/></g>
      <animateTransform attributeName="transform" additive="sum" type="translate" values="0 0;0 -3;0 0" dur="4.8s" repeatCount="indefinite"/></g>
    <text class="t" x="28" y="102">Users</text>
    <text class="d" x="28" y="128">Create and manage users</text>
    <text class="d" x="28" y="148">Borrowed books per user</text>
    <text class="d" x="28" y="168">Lending tied to a user</text>
  </g>

  <g transform="translate(768 0)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur=".7s" begin=".45s" fill="freeze"/>
    <rect class="card" x=".5" y=".5" width="231" height="209" rx="12"/>
    <g transform="translate(28 30)"><g class="i"><ellipse cx="17" cy="8" rx="13" ry="5"/><path d="M4 8v10c0 2.8 5.8 5 13 5s13-2.2 13-5V8M4 18v10c0 2.8 5.8 5 13 5s13-2.2 13-5V18"/></g>
      <animateTransform attributeName="transform" additive="sum" type="translate" values="0 0;0 -3;0 0" dur="5.2s" repeatCount="indefinite"/></g>
    <text class="t" x="28" y="102">Persistence</text>
    <text class="d" x="28" y="128">SQLite through JDBC</text>
    <text class="d" x="28" y="148">Dedicated DB controllers</text>
    <text class="d" x="28" y="168">Availability in the database</text>
  </g>
</svg>
