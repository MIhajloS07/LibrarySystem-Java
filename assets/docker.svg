<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Multi-stage Docker build" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .bg{fill:#0b1220}
      .grp{fill:#0f1a2e;stroke-width:1.5;stroke-dasharray:6 5}
      .box{fill:#14213a;stroke-width:1.5}
      .h{font:700 15px 'Segoe UI',Arial,sans-serif;fill:#f1f5f9;text-anchor:middle}
      .s{font:12px 'SFMono-Regular',Consolas,monospace;fill:#94a3b8;text-anchor:middle}
      .tag{font:700 11px 'Segoe UI',Arial,sans-serif;letter-spacing:2px;text-anchor:middle}
      .line{stroke:#2b3a58;stroke-width:2;fill:none;stroke-dasharray:5 5}
    </style>
  </defs>
  <rect class="bg" width="1000" height="260" rx="14"/>

  <rect class="grp" x="198" y="48" width="384" height="150" rx="14" stroke="#38bdf8"/>
  <text class="tag" x="390" y="72" fill="#38bdf8">STAGE 1 · BUILD</text>
  <rect class="grp" x="608" y="48" width="204" height="150" rx="14" stroke="#34d399"/>
  <text class="tag" x="710" y="72" fill="#34d399">STAGE 2 · RUNTIME</text>

  <path class="line" d="M155 135H215M385 135H445M565 135H625M795 135H855"/>

  <g><rect class="box" x="25" y="100" width="130" height="70" rx="10" stroke="#64748b"/>
    <text class="h" x="90" y="130">Source</text><text class="s" x="90" y="150">pom.xml · src</text></g>
  <g><rect class="box" x="215" y="100" width="170" height="70" rx="10" stroke="#38bdf8"/>
    <text class="h" x="300" y="126">Maven + JDK 21</text><text class="s" x="300" y="148">mvn test, package</text></g>
  <g><rect class="box" x="445" y="100" width="120" height="70" rx="10" stroke="#818cf8"/>
    <text class="h" x="505" y="130">JAR</text><text class="s" x="505" y="150">artifact</text></g>
  <g><rect class="box" x="625" y="100" width="170" height="70" rx="10" stroke="#34d399"/>
    <text class="h" x="710" y="126">JRE 21 image</text><text class="s" x="710" y="148">temurin:21-jre</text></g>
  <g><rect class="box" x="855" y="100" width="120" height="70" rx="10" stroke="#64748b"/>
    <text class="h" x="915" y="130">App</text><text class="s" x="915" y="150">console menu</text></g>

  <circle r="6" fill="#38bdf8"><animateMotion dur="7s" repeatCount="indefinite" path="M90 135H915" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.04;.96;1" dur="7s" repeatCount="indefinite"/></circle>
  <circle r="6" fill="#34d399"><animateMotion dur="7s" begin="3.5s" repeatCount="indefinite" path="M90 135H915" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.04;.96;1" dur="7s" begin="3.5s" repeatCount="indefinite"/></circle>

  <text class="s" x="500" y="232" style="font-family:'Segoe UI',Arial,sans-serif;font-size:13px">If any test fails, the build stops and no image is produced. Only the JAR reaches the runtime image.</text>
</svg>
