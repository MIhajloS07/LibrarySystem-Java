<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="30 of 30 tests passing" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
  </defs>
  <rect width="1000" height="250" rx="14" fill="#0b1220"/>

  <!-- donut -->
  <circle cx="150" cy="125" r="72" fill="none" stroke="#1b2740" stroke-width="18"/>
  <circle cx="150" cy="125" r="72" fill="none" stroke="url(#ring)" stroke-width="18" stroke-linecap="round"
          stroke-dasharray="452.4" stroke-dashoffset="452.4" transform="rotate(-90 150 125)">
    <animate attributeName="stroke-dashoffset" from="452.4" to="0" dur="1.6s" begin=".2s" fill="freeze"/>
  </circle>
  <text x="150" y="128" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="38" font-weight="700" fill="#f8fafc">30/30</text>
  <text x="150" y="152" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#94a3b8" letter-spacing="2">PASSING</text>

  <!-- terminal -->
  <rect x="300" y="30" width="670" height="190" rx="10" fill="#060a13" stroke="#1f2b45"/>
  <circle cx="324" cy="52" r="5" fill="#f87171"/><circle cx="342" cy="52" r="5" fill="#fbbf24"/><circle cx="360" cy="52" r="5" fill="#34d399"/>
  <g font-family="'SFMono-Regular',Consolas,monospace" font-size="15">
    <text x="324" y="96" fill="#e2e8f0" opacity="0">$ mvn test<animate attributeName="opacity" from="0" to="1" dur=".3s" begin=".4s" fill="freeze"/></text>
    <text x="324" y="126" fill="#94a3b8" opacity="0">Running model and controller tests...<animate attributeName="opacity" from="0" to="1" dur=".3s" begin="1.1s" fill="freeze"/></text>
    <text x="324" y="156" fill="#e2e8f0" opacity="0">Tests run: 30, Failures: 0, Errors: 0, Skipped: 0<animate attributeName="opacity" from="0" to="1" dur=".3s" begin="1.9s" fill="freeze"/></text>
    <text x="324" y="196" fill="#34d399" font-weight="700" opacity="0">BUILD SUCCESS<animate attributeName="opacity" from="0" to="1" dur=".3s" begin="2.6s" fill="freeze"/></text>
    <rect x="460" y="182" width="9" height="17" fill="#34d399" opacity="0"><animate attributeName="opacity" values="0;1;0;1;0" dur="1.2s" begin="3s" repeatCount="indefinite"/></rect>
  </g>
</svg>
